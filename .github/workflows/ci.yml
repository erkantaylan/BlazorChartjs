name: CI

# Builds and tests every push and pull request, so breakage surfaces here rather than
# during a release. The publish workflow runs the same tests again before packing;
# this one exists so nobody discovers a failure while cutting a tag.
#
# The Chart.js option-key allowlist the tests validate against is checked in at
# tests/Erkan.Blazor.Chartjs.Tests/ChartJs/chartjs-option-paths.json, so this workflow
# needs no Node and no network beyond NuGet. After bumping anything under
# src/wwwroot/lib, regenerate it:
#
#     cd tests/tools/chartjs-keys && npm install && npm run generate
#
# The suite fails if you forget: it compares the versions recorded in that file against
# the version banners of the vendored bundles.

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/Erkan.Blazor.Chartjs.Tests/Erkan.Blazor.Chartjs.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      # Uploaded even on failure: the key-validation test reports each offending path and
      # what its parent object does accept, which is the whole diagnosis.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: warn

      # A failing snapshot prints its own diff, but the rewritten files are easier to read.
      # Re-record locally with: UPDATE_SNAPSHOTS=1 dotnet test
      - name: Show snapshot drift
        if: failure()
        run: git diff --stat -- tests/Erkan.Blazor.Chartjs.Tests/Snapshots || true
